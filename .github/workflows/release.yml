name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loryventoy-windows
          path: target/release/Loryventoy.exe
          retention-days: 1

  build-linux:
    name: Linux (GNU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Create AppImage (optional)
        run: |
          # cargo-bundle para AppImage
          cargo install cargo-bundle
          cargo bundle --release --format appimage
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loryventoy-linux
          path: |
            target/release/Loryventoy
            target/release/bundle/appimage/*.AppImage
          retention-days: 1

  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release (Intel)
        run: cargo build --release --target x86_64-apple-darwin
      - name: Build release (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/Loryventoy \
            target/aarch64-apple-darwin/release/Loryventoy \
            -output target/release/Loryventoy-universal
      - name: Create .app bundle (cargo-bundle)
        run: |
          cargo install cargo-bundle
          cargo bundle --release --format dmg
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loryventoy-macos
          path: |
            target/release/Loryventoy-universal
            target/release/bundle/dmg/*.dmg
            target/release/bundle/osx/*.app
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p release
          # Windows
          cp artifacts/Loryventoy-windows/Loryventoy.exe release/Loryventoy-windows.exe
          # Linux
          cp artifacts/Loryventoy-linux/Loryventoy release/Loryventoy-linux
          # Linux AppImage (if exists)
          if [ -f artifacts/Loryventoy-linux/*.AppImage ]; then
            cp artifacts/Loryventoy-linux/*.AppImage release/
          fi
          # macOS
          cp artifacts/Loryventoy-macos/Loryventoy-universal release/Loryventoy-macos-universal
          # macOS .app (if exists)
          if [ -d artifacts/Loryventoy-macos/*.app ]; then
            cp -r artifacts/Loryventoy-macos/*.app release/
          fi
          # macOS .dmg (if exists)
          if [ -f artifacts/Loryventoy-macos/*.dmg ]; then
            cp artifacts/Loryventoy-macos/*.dmg release/
          fi
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}