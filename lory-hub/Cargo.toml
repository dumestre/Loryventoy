[package]
name = "lory-hub"
version = "0.1.0"
edition = "2021"
description = "Hub launcher for Loryventoy using Slint"
license = "GPL-3.0"

[dependencies]
slint = { version = "1", features = ["unstable-fontique-010"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1"
winres = "0.1"
image = "0.25"